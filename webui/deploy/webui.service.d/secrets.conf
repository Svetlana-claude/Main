# Ключи приложения — файлом, недоступным пользователю.
#
# Зачем: `claude` в теме проекта работает от того же пользователя, что и служба,
# и при поднятом allow_bash читает командой любой файл этого пользователя —
# запрет по пути на инструменты чтения тут не помогает. Файл с владельцем root
# и правами 600 такой возможности не оставляет: приложение получает значения
# от systemd, а доступного пользователю файла попросту нет.
#
# Значения дочернему `claude` не передаются: драйвер вычищает их из окружения
# по списку config.SCRUB_ENV_KEYS.
#
# Ставится скриптом infra/secrets-to-root.sh (нужен root с паролем: правка
# юнитов в беспарольный sudo сознательно не входит).
[Service]
EnvironmentFile=/etc/webui/webui.env
