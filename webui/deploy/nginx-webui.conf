# Веб-интерфейс рабочего места. Точка входа — /Claude.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Пароль не должен уходить открытым текстом — весь HTTP уводим на HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/webui.crt;
    ssl_certificate_key /etc/nginx/ssl/webui.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 70m;   # чуть больше предела загрузки файлов в приложении

    # Ограничение частоты обращений к форме входа: подбор пароля упирается ещё до приложения
    location = /Claude/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/login;
        include /etc/nginx/snippets/webui-proxy.conf;
    }

    location /Claude/ {
        proxy_pass http://127.0.0.1:8000/;
        include /etc/nginx/snippets/webui-proxy.conf;

        # Поток ответа в диалоге не должен копиться в буфере nginx
        proxy_buffering off;
        proxy_cache off;
        # Агентская работа бывает долгой — держим соединение
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /Claude { return 301 /Claude/; }
    location = /       { return 301 /Claude/; }

    location / { return 404; }
}
