# Веб-интерфейс рабочего места. Точка входа — /Claude.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Проверка владения доменом для Let's Encrypt. Certbot кладёт файл в webroot,
    # проверяющий забирает его по HTTP — уводить этот путь на HTTPS нельзя:
    # доверенного сертификата ещё нет, и проверка сорвётся. Здесь нет ничего
    # секретного, случайная строка живёт секунды.
    # ^~ важно: приоритет над «location /» ниже, иначе сработает редирект.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Пароль не должен уходить открытым текстом — весь HTTP уводим на HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Блок идёт первым для этого порта, поэтому он же отвечает на обращения,
    # не подходящие ни под одно имя, — например по адресу 46.8.178.196.
    # Браузер при таком заходе предупредит о подлинности, и это правильно:
    # сертификат выдан на имена, а не на адрес.
    server_name mokeevasky.ru;

    ssl_certificate     /etc/letsencrypt/live/mokeevasky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mokeevasky.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 70m;   # чуть больше предела загрузки файлов в приложении

    # Ограничение частоты обращений к форме входа: подбор пароля упирается ещё до приложения
    location = /Claude/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/login;
        include /etc/nginx/snippets/webui-proxy.conf;
    }

    location /Claude/ {
        proxy_pass http://127.0.0.1:8000/;
        include /etc/nginx/snippets/webui-proxy.conf;

        # Поток ответа в диалоге не должен копиться в буфере nginx
        proxy_buffering off;
        proxy_cache off;
        # Агентская работа бывает долгой — держим соединение
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /Claude { return 301 /Claude/; }
    location = /       { return 301 /Claude/; }

    location / { return 404; }
}

# Адрес с www уводится на основной. Сертификат покрывает оба имени, так что
# зайти можно по любому — но работать интерфейс должен под одним: вход хранится
# в cookie, а cookie привязана к имени. Иначе вход под www и вход без него
# оказались бы разными сеансами, и это выглядело бы как случайный разлогин.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mokeevasky.ru;

    ssl_certificate     /etc/letsencrypt/live/mokeevasky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mokeevasky.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://mokeevasky.ru$request_uri;
}
