<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змея: четыре варианта расположения</title>
<style>
  :root{
    --fon:#f4f2ee;
    --karta:#ffffff;
    --tekst:#1b1a18;
    --tusklo:#6f6a62;
    --ramka:#ddd8d0;
    --akcent:#7a2e2e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px;
    background:var(--fon); color:var(--tekst);
    font:16px/1.5 "PT Sans", "Segoe UI", system-ui, sans-serif;
  }
  h1{font-size:24px; margin:0 0 4px}
  .podzagolovok{color:var(--tusklo); margin:0 0 20px; max-width:70ch}

  /* --- панель управления --- */
  .pult{
    display:flex; flex-wrap:wrap; gap:18px 26px; align-items:flex-end;
    background:var(--karta); border:1px solid var(--ramka); border-radius:10px;
    padding:16px 18px; margin-bottom:24px;
  }
  .pole{display:flex; flex-direction:column; gap:6px}
  .pole label{font-size:13px; color:var(--tusklo)}
  .pole input[type=range]{width:170px}
  .pole select{
    padding:6px 8px; border:1px solid var(--ramka); border-radius:6px;
    background:#fff; color:inherit; font:inherit;
  }
  .flazhok{flex-direction:row; align-items:center; gap:8px}
  .flazhok label{font-size:15px; color:var(--tekst)}
  button{
    font:inherit; padding:8px 14px; border-radius:6px; cursor:pointer;
    border:1px solid var(--ramka); background:#fff; color:inherit;
  }
  button:hover{border-color:var(--akcent); color:var(--akcent)}
  button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--akcent); outline-offset:2px;
  }

  /* --- сетка вариантов --- */
  .setka{
    display:grid; gap:20px;
    grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
  }
  .karta{
    background:var(--karta); border:1px solid var(--ramka); border-radius:10px;
    padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  .karta h2{font-size:17px; margin:0}
  .karta p{margin:0; font-size:13.5px; color:var(--tusklo); min-height:3em}
  .holst{
    /* широкий рисунок скроллится внутри карточки, страница не едет */
    overflow:auto; background:#fff; border-radius:6px;
  }
  .holst svg{display:block; width:100%; height:auto}
  .niz{display:flex; gap:8px}
  .niz button{flex:1; font-size:14px; padding:6px 10px}

  @media (max-width:600px){ body{padding:14px} .pult{gap:14px} }
</style>
</head>
<body>

<h1>Змея: четыре варианта расположения</h1>
<p class="podzagolovok">
  Тело строится по осевой линии: изгибы задаются опорными точками, чешуя выкладывается
  рядами поперёк тела и сама сужается к хвосту. Настройки ниже меняют все четыре рисунка
  разом. Кнопка «Скачать SVG» отдаёт вектор — его можно открыть в Illustrator или Inkscape.
</p>

<div class="pult">
  <div class="pole">
    <label for="stil">Стиль</label>
    <select id="stil">
      <option value="kontur" selected>Линейный контур</option>
      <option value="blek">Блэкворк</option>
      <option value="realizm">Серый реализм</option>
    </select>
  </div>
  <div class="pole">
    <label for="tolshchina">Толщина тела: <b id="tolshchina-znach">26</b></label>
    <input type="range" id="tolshchina" min="14" max="40" step="1" value="26">
  </div>
  <div class="pole">
    <label for="ryady">Чешуй в ряду: <b id="ryady-znach">13</b></label>
    <input type="range" id="ryady" min="7" max="21" step="2" value="13">
  </div>
  <div class="pole">
    <label for="shag">Шаг рядов: <b id="shag-znach">9</b></label>
    <input type="range" id="shag" min="5" max="16" step="1" value="9">
  </div>
  <div class="pole flazhok">
    <input type="checkbox" id="shchitki" checked>
    <label for="shchitki">Подбрюшные щитки</label>
  </div>
  <div class="pole flazhok">
    <input type="checkbox" id="yazyk" checked>
    <label for="yazyk">Язык</label>
  </div>
  <div class="pole">
    <button type="button" id="skachat-vse">Скачать все четыре</button>
  </div>
</div>

<div class="setka" id="setka"></div>

<script>
'use strict';

/* ==========================================================================
   1. Вспомогательная математика
   ========================================================================== */

const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;

function smoothstep(t){
  t = Math.min(1, Math.max(0, t));
  return t * t * (3 - 2 * t);
}

/** Детерминированный шум: одна и та же чешуйка всегда одинакова. */
function shum(seed){
  let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);           // [0, 1)
}

/**
 * Сглаживание опорных точек сплайном Катмулла — Рома.
 * Возвращает густую ломаную; замкнутая кривая — closed = true.
 */
function splayn(tochki, closed, naSegment){
  const n = tochki.length;
  const vzyat = i => closed
    ? tochki[((i % n) + n) % n]
    : tochki[Math.min(n - 1, Math.max(0, i))];
  const out = [];
  const posledniy = closed ? n : n - 1;
  for(let i = 0; i < posledniy; i++){
    const p0 = vzyat(i - 1), p1 = vzyat(i), p2 = vzyat(i + 1), p3 = vzyat(i + 2);
    for(let j = 0; j < naSegment; j++){
      const t = j / naSegment, t2 = t * t, t3 = t2 * t;
      out.push({
        x: 0.5 * (2*p1.x + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3),
        y: 0.5 * (2*p1.y + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3)
      });
    }
  }
  if(!closed) out.push({ x: tochki[n-1].x, y: tochki[n-1].y });
  return out;
}

/**
 * Разбивает ломаную на точки через равные промежутки по длине
 * и считает в каждой касательную и нормаль.
 */
function ravnomerno(lomanaya, shag){
  const summa = [0];
  for(let i = 1; i < lomanaya.length; i++){
    summa.push(summa[i-1] + Math.hypot(
      lomanaya[i].x - lomanaya[i-1].x,
      lomanaya[i].y - lomanaya[i-1].y
    ));
  }
  const dlina = summa[summa.length - 1];
  const skolko = Math.max(8, Math.round(dlina / shag));
  const out = [];
  let seg = 1;
  for(let k = 0; k <= skolko; k++){
    const d = dlina * k / skolko;
    while(seg < summa.length - 1 && summa[seg] < d) seg++;
    const znam = Math.max(1e-6, summa[seg] - summa[seg-1]);
    const t = (d - summa[seg-1]) / znam;
    out.push({
      x: lerp(lomanaya[seg-1].x, lomanaya[seg].x, t),
      y: lerp(lomanaya[seg-1].y, lomanaya[seg].y, t),
      s: k / skolko
    });
  }
  for(let i = 0; i < out.length; i++){
    const a = out[Math.max(0, i-1)], b = out[Math.min(out.length-1, i+1)];
    const dx = b.x - a.x, dy = b.y - a.y;
    const L = Math.hypot(dx, dy) || 1;
    out[i].tx =  dx / L;  out[i].ty =  dy / L;   // вдоль тела, к хвосту
    out[i].nx = -dy / L;  out[i].ny =  dx / L;   // поперёк тела
  }
  out.dlina = dlina;
  return out;
}

/** Профиль толщины: шея тоньше, спина полная, хвост сходит на нет. */
function profil(s){
  if(s < 0.13) return lerp(0.74, 1, smoothstep(s / 0.13));
  if(s < 0.40) return 1;
  const u = (s - 0.40) / 0.60;
  return Math.max(0, Math.pow(1 - u, 1.25) * (1 - 0.12 * u));
}

const okr = v => v.toFixed(2);

/* ==========================================================================
   2. Построение тела
   ========================================================================== */

/** Контур куска тела от sOt до sDo — идём по одному краю и возвращаемся по другому. */
function konturTela(os, polShirina, sOt, sDo){
  const levo = [], pravo = [];
  for(const p of os){
    if(p.s < sOt - 1e-9 || p.s > sDo + 1e-9) continue;
    const w = polShirina(p.s);
    levo.push(okr(p.x + p.nx * w) + ',' + okr(p.y + p.ny * w));
    pravo.push(okr(p.x - p.nx * w) + ',' + okr(p.y - p.ny * w));
  }
  if(levo.length < 2) return '';
  pravo.reverse();
  return 'M' + levo.join('L') + 'L' + pravo.join('L') + 'Z';
}

/** Осевая линия куска тела — нужна для «подложки» на перехлёстах. */
function osevayaLiniya(os, sOt, sDo){
  const t = os.filter(p => p.s >= sOt - 1e-9 && p.s <= sDo + 1e-9)
              .map(p => okr(p.x) + ',' + okr(p.y));
  return t.length < 2 ? '' : 'M' + t.join('L');
}

/** Одна чешуйка: каплевидный лепесток, острым концом к голове. */
function cheshuyka(cx, cy, tx, ty, nx, ny, a, b){
  const P = (x, y) => okr(cx + tx*x + nx*y) + ',' + okr(cy + ty*x + ny*y);
  return 'M' + P(-a, 0)
       + 'C' + P(-a*0.35, -b) + ',' + P(a*0.55, -b) + ',' + P(a, 0)
       + 'C' + P( a*0.55,  b) + ',' + P(-a*0.35, b) + ',' + P(-a, 0) + 'Z';
}

/**
 * Раскладка чешуи по телу. Число чешуй в ряду постоянно, поэтому к хвосту
 * они сами мельчают — как у настоящей змеи. Соседние ряды сдвинуты на полячейки.
 */
function cheshuya(os, polShirina, nastr){
  const { stolbcov, shagRyadov } = nastr;
  const shagIndeksa = Math.max(1, Math.round(shagRyadov / 2));   // ось сэмплирована через 2 px
  const out = [];
  let ryad = 0;
  for(let i = 0; i < os.length; i += shagIndeksa, ryad++){
    const p = os[i];
    const w = polShirina(p.s);
    if(w < 1.6) continue;
    const sdvig = (ryad % 2) ? 0.5 : 0;
    const yacheykaV = (2 * w) / stolbcov;
    for(let c = 0; c <= stolbcov; c++){
      const v = -w + (c + sdvig) * yacheykaV;
      if(v < -w || v > w) continue;
      const drozh = 0.86 + 0.28 * shum(ryad * 31.4 + c * 7.7);
      out.push({
        d: cheshuyka(
          p.x + p.nx * v, p.y + p.ny * v,
          p.tx, p.ty, p.nx, p.ny,
          shagRyadov * 0.62 * drozh, yacheykaV * 0.52 * drozh
        ),
        s: p.s,
        /* 0 — хребет, 1 — край бока: по этому числу кладётся светотень */
        bok: Math.min(1, Math.abs(v) / w)
      });
    }
  }
  return out;
}

/** Подбрюшные щитки — широкие поперечные пластины вдоль одного края. */
function shchitki(os, polShirina, shagRyadov){
  const shagIndeksa = Math.max(2, Math.round(shagRyadov * 0.85));
  const out = [];
  for(let i = 0; i < os.length; i += shagIndeksa){
    const p = os[i];
    const w = polShirina(p.s);
    if(w < 2.4) continue;
    const v1 = w * 0.46, v2 = w * 0.985;
    const a = shagRyadov * 0.40;
    const P = (x, y) => okr(p.x + p.tx*x + p.nx*y) + ',' + okr(p.y + p.ty*x + p.ny*y);
    out.push({
      d: 'M' + P(-a, v1) + 'C' + P(a*0.4, v1*0.92) + ',' + P(a*0.4, v2*0.92) + ',' + P(-a, v2)
             + 'L' + P( a, v2) + 'C' + P(a*1.5, v2*0.96) + ',' + P(a*1.5, v1*0.96) + ',' + P(a, v1) + 'Z',
      s: p.s
    });
  }
  return out;
}

/* ==========================================================================
   3. Голова
   ========================================================================== */

/**
 * Голова сидит на нулевой точке оси и смотрит против хода тела.
 * Локальные координаты: x — к морде, y — поперёк.
 */
function golova(os, dlina, shirina, sYazykom){
  const p = os[0];
  const ax = -p.tx, ay = -p.ty;
  const bx =  p.nx, by =  p.ny;
  const L = dlina, W = shirina;
  const P = (x, y) => okr(p.x + ax*x*L + bx*y*W) + ',' + okr(p.y + ay*x*L + by*y*W);

  const chasti = {};

  chasti.kontur =
      'M' + P(-0.06, -0.78)
    + 'C' + P(0.16, -1.34) + ',' + P(0.60, -1.22) + ',' + P(0.90, -0.48)
    + 'C' + P(1.01, -0.20) + ',' + P(1.01,  0.20) + ',' + P(0.90,  0.48)
    + 'C' + P(0.60,  1.22) + ',' + P(0.16,  1.34) + ',' + P(-0.06, 0.78) + 'Z';

  /* Щитки на темени — крупные пластины, а не мелкая чешуя */
  chasti.plastiny = [
    'M' + P(0.10, -0.92) + 'C' + P(0.34, -0.70) + ',' + P(0.34, 0.70) + ',' + P(0.10, 0.92),
    'M' + P(0.40, -0.92) + 'C' + P(0.58, -0.62) + ',' + P(0.58, 0.62) + ',' + P(0.40, 0.92),
    'M' + P(0.72, -0.72) + 'C' + P(0.82, -0.44) + ',' + P(0.82, 0.44) + ',' + P(0.72, 0.72),
    'M' + P(0.46, -0.30) + 'L' + P(0.92, -0.14),
    'M' + P(0.46,  0.30) + 'L' + P(0.92,  0.14)
  ];

  chasti.pasti = [
    'M' + P(0.99, -0.05) + 'C' + P(0.78, -0.62) + ',' + P(0.42, -1.02) + ',' + P(0.06, -0.96),
    'M' + P(0.99,  0.05) + 'C' + P(0.78,  0.62) + ',' + P(0.42,  1.02) + ',' + P(0.06,  0.96)
  ];

  chasti.glaza = [
    { c: P(0.56, -0.78), r: okr(0.115 * L) },
    { c: P(0.56,  0.78), r: okr(0.115 * L) }
  ];
  chasti.bliki = [
    { c: P(0.52, -0.84), r: okr(0.035 * L) },
    { c: P(0.52,  0.84), r: okr(0.035 * L) }
  ];
  chasti.nozdri = [
    { c: P(0.88, -0.30), r: okr(0.032 * L) },
    { c: P(0.88,  0.30), r: okr(0.032 * L) }
  ];

  chasti.yazyk = sYazykom
    ? 'M' + P(1.00, 0) + 'C' + P(1.26, -0.10) + ',' + P(1.38, -0.06) + ',' + P(1.52, -0.12)
          + 'M' + P(1.38, -0.07) + 'C' + P(1.46, 0.12) + ',' + P(1.58, 0.26) + ',' + P(1.70, 0.34)
          + 'M' + P(1.38, -0.07) + 'C' + P(1.52, -0.18) + ',' + P(1.68, -0.40) + ',' + P(1.74, -0.56)
    : null;

  return chasti;
}

/* ==========================================================================
   4. Оформление: три стиля
   ========================================================================== */

const STILI = {
  kontur: {
    fon:'#ffffff', telo:'#ffffff', obvodka:'#141210', obvodkaTolshchina:2.0,
    cheshuyaZalivka:() => 'none', cheshuyaLiniya:'#141210', cheshuyaTolshchina:0.85,
    shchitokZalivka:'none', shchitokLiniya:'#141210',
    golovaZalivka:'#ffffff', liniya:'#141210', glaz:'#141210', blik:'#ffffff'
  },
  blek: {
    fon:'#ffffff', telo:'#141210', obvodka:'#141210', obvodkaTolshchina:2.0,
    cheshuyaZalivka:() => 'none', cheshuyaLiniya:'#ffffff', cheshuyaTolshchina:0.9,
    shchitokZalivka:'#ffffff', shchitokLiniya:'#141210',
    golovaZalivka:'#141210', liniya:'#ffffff', glaz:'#ffffff', blik:'#141210'
  },
  realizm: {
    fon:'#ffffff', telo:'#cfc9c1', obvodka:'#2a2622', obvodkaTolshchina:1.4,
    /* светотень: хребет светлее, бока уходят в тень */
    cheshuyaZalivka: bok => {
      const svet = Math.round(92 - 58 * Math.pow(bok, 1.35));
      return `hsl(32 8% ${svet}%)`;
    },
    cheshuyaLiniya:'#3a342e', cheshuyaTolshchina:0.45,
    shchitokZalivka:'#efeae3', shchitokLiniya:'#4a433b',
    golovaZalivka:'#d8d2ca', liniya:'#2a2622', glaz:'#17140f', blik:'#ffffff'
  }
};

/* ==========================================================================
   5. Четыре расположения
   ========================================================================== */

/** Кольцо: голова над витком, тело уходит спиралью наружу. */
function tochkiKoltso(){
  const t = [];
  const cx = 260, cy = 430;
  for(let i = 0; i <= 22; i++){
    const a = -Math.PI / 2 + (i / 22) * (TAU * 1.55);
    const r = 92 + (i / 22) * 132;
    t.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.96 });
  }
  return t;
}

/** Восьмёрка: лемниската, тело само себя перехлёстывает посередине. */
function tochkiVosmerka(){
  const t = [];
  for(let i = 0; i <= 26; i++){
    const a = -Math.PI / 2 + (i / 26) * TAU * 0.98;
    t.push({
      x: 258 + 150 * Math.sin(a),
      y: 392 + 244 * Math.sin(a) * Math.cos(a)
    });
  }
  return t;
}

/** Диагональ: три плотных витка, тело стекает сверху вниз. */
function tochkiDiagonal(){
  const t = [];
  for(let i = 0; i <= 30; i++){
    const u = i / 30;
    const a = u * TAU * 1.9;
    t.push({
      x: 258 + Math.sin(a) * (128 - 46 * u),
      y: 108 + u * 540 + Math.cos(a) * 26
    });
  }
  return t;
}

const VARIANTY = [
  {
    kod: 'a',
    nazvanie: 'A. Классическая S',
    zametka: 'Два широких изгиба вдоль предплечья. Голова сверху, хвост уходит вниз — самая спокойная посадка, хорошо тянется по руке.',
    tochki: [
      {x:250,y:132},{x:346,y:238},{x:170,y:352},{x:344,y:470},{x:186,y:596},{x:268,y:700}
    ],
    perehlyosty: []
  },
  {
    kod: 'b',
    nazvanie: 'B. Кольцо',
    zametka: 'Тело свёрнуто витком, голова поднята над кольцом. Компактно — ложится на плечо, лопатку или икру.',
    tochki: tochkiKoltso(),
    perehlyosty: [[0.62, 1.0]]
  },
  {
    kod: 'v',
    nazvanie: 'В. Восьмёрка',
    zametka: 'Знак бесконечности: тело перехлёстывает само себя посередине. Верхняя петля идёт поверх нижней.',
    tochki: tochkiVosmerka(),
    perehlyosty: [[0.55, 1.0]]
  },
  {
    kod: 'g',
    nazvanie: 'Г. Диагональ с витками',
    zametka: 'Три плотных витка, тело стекает сверху вниз. Вариант под длинную узкую зону — предплечье, голень, бок.',
    tochki: tochkiDiagonal(),
    perehlyosty: []
  }
];

/* ==========================================================================
   6. Сборка SVG
   ========================================================================== */

const NS = 'http://www.w3.org/2000/svg';
const el = (imya, atr) => {
  const n = document.createElementNS(NS, imya);
  for(const k in atr) n.setAttribute(k, atr[k]);
  return n;
};

function narisovat(variant, nastr){
  const st = STILI[nastr.stil];
  const svg = el('svg', {
    xmlns: NS, viewBox: '0 0 520 780',
    role: 'img', 'aria-label': 'Эскиз тату: змея, ' + variant.nazvanie
  });
  svg.appendChild(el('title', {})).textContent = variant.nazvanie;
  svg.appendChild(el('rect', { x:0, y:0, width:520, height:780, fill: st.fon }));

  const gustaya = splayn(variant.tochki, false, 24);
  const os = ravnomerno(gustaya, 2);
  const polShirina = s => nastr.tolshchina * 0.5 * profil(s);

  const vseCheshui = cheshuya(os, polShirina, nastr);
  const vseShchitki = nastr.shchitki ? shchitki(os, polShirina, nastr.shagRyadov) : [];

  /* Кусок тела: контур, чешуя, щитки. Рисуется целиком и потом ещё раз
     поверх — там, где тело перехлёстывает само себя. */
  function kusok(sOt, sDo, sPodlozhkoy){
    const g = el('g', {});
    if(sPodlozhkoy){
      const os2 = osevayaLiniya(os, sOt, sDo);
      if(os2) g.appendChild(el('path', {
        d: os2, fill:'none', stroke: st.fon,
        'stroke-width': nastr.tolshchina + 9,
        'stroke-linecap':'round', 'stroke-linejoin':'round'
      }));
    }
    const k = konturTela(os, polShirina, sOt, sDo);
    if(k) g.appendChild(el('path', {
      d: k, fill: st.telo, stroke: st.obvodka,
      'stroke-width': st.obvodkaTolshchina, 'stroke-linejoin':'round'
    }));

    const gCh = el('g', { 'stroke-width': st.cheshuyaTolshchina, 'stroke-linejoin':'round' });
    for(const c of vseCheshui){
      if(c.s < sOt || c.s > sDo) continue;
      gCh.appendChild(el('path', {
        d: c.d, fill: st.cheshuyaZalivka(c.bok), stroke: st.cheshuyaLiniya
      }));
    }
    g.appendChild(gCh);

    if(vseShchitki.length){
      const gSh = el('g', { fill: st.shchitokZalivka, stroke: st.shchitokLiniya, 'stroke-width':0.7 });
      for(const sh of vseShchitki){
        if(sh.s < sOt || sh.s > sDo) continue;
        gSh.appendChild(el('path', { d: sh.d }));
      }
      g.appendChild(gSh);
    }
    return g;
  }

  svg.appendChild(kusok(0, 1, false));
  for(const [a, b] of variant.perehlyosty) svg.appendChild(kusok(a, b, true));

  /* --- голова --- */
  const gl = golova(os, nastr.tolshchina * 1.55, nastr.tolshchina * 0.62, nastr.yazyk);
  const gG = el('g', {});
  if(gl.yazyk) gG.appendChild(el('path', {
    d: gl.yazyk, fill:'none', stroke: st.obvodka,
    'stroke-width': 1.8, 'stroke-linecap':'round'
  }));
  gG.appendChild(el('path', {
    d: gl.kontur, fill: st.golovaZalivka, stroke: st.obvodka,
    'stroke-width': st.obvodkaTolshchina, 'stroke-linejoin':'round'
  }));
  for(const d of gl.plastiny) gG.appendChild(el('path', {
    d, fill:'none', stroke: st.liniya, 'stroke-width': 0.9
  }));
  for(const d of gl.pasti) gG.appendChild(el('path', {
    d, fill:'none', stroke: st.liniya, 'stroke-width': 1.3, 'stroke-linecap':'round'
  }));
  for(const n of gl.nozdri) gG.appendChild(el('circle', {
    cx: n.c.split(',')[0], cy: n.c.split(',')[1], r: n.r, fill: st.liniya
  }));
  for(const g of gl.glaza) gG.appendChild(el('circle', {
    cx: g.c.split(',')[0], cy: g.c.split(',')[1], r: g.r,
    fill: st.glaz, stroke: st.obvodka, 'stroke-width': 1
  }));
  for(const b of gl.bliki) gG.appendChild(el('circle', {
    cx: b.c.split(',')[0], cy: b.c.split(',')[1], r: b.r, fill: st.blik
  }));
  svg.appendChild(gG);

  return svg;
}

/* ==========================================================================
   7. Страница
   ========================================================================== */

function nastroyki(){
  return {
    stil:        document.getElementById('stil').value,
    tolshchina:  +document.getElementById('tolshchina').value,
    stolbcov:    +document.getElementById('ryady').value,
    shagRyadov:  +document.getElementById('shag').value,
    shchitki:    document.getElementById('shchitki').checked,
    yazyk:       document.getElementById('yazyk').checked
  };
}

function skachat(svg, imya){
  const tekst = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([tekst], { type:'image/svg+xml' }));
  const a = document.createElement('a');
  a.href = url; a.download = imya;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pererisovat(){
  const n = nastroyki();
  const setka = document.getElementById('setka');
  setka.textContent = '';
  for(const v of VARIANTY){
    const karta = document.createElement('div');
    karta.className = 'karta';

    const h = document.createElement('h2');
    h.textContent = v.nazvanie;
    karta.appendChild(h);

    const holst = document.createElement('div');
    holst.className = 'holst';
    const svg = narisovat(v, n);
    holst.appendChild(svg);
    karta.appendChild(holst);

    const p = document.createElement('p');
    p.textContent = v.zametka;
    karta.appendChild(p);

    const niz = document.createElement('div');
    niz.className = 'niz';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Скачать SVG';
    b.addEventListener('click', () => skachat(svg, 'zmeya-' + v.kod + '-' + n.stil + '.svg'));
    niz.appendChild(b);
    karta.appendChild(niz);

    setka.appendChild(karta);
  }
  document.getElementById('tolshchina-znach').textContent = n.tolshchina;
  document.getElementById('ryady-znach').textContent = n.stolbcov;
  document.getElementById('shag-znach').textContent = n.shagRyadov;
}

for(const id of ['stil','tolshchina','ryady','shag','shchitki','yazyk']){
  document.getElementById(id).addEventListener('input', pererisovat);
}
document.getElementById('skachat-vse').addEventListener('click', () => {
  const n = nastroyki();
  VARIANTY.forEach((v, i) => setTimeout(
    () => skachat(narisovat(v, n), 'zmeya-' + v.kod + '-' + n.stil + '.svg'),
    i * 250
  ));
});

pererisovat();
</script>
