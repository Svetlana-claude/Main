{% extends "base.html" %}
{% set title = "Настройки" %}
{% block content %}
<section class="panel">
  <h1>Настройки</h1>
  <h2>Смена пароля</h2>
  {% if pw_msg %}<p class="{{ 'ok' if pw_ok else 'error' }}" role="status">{{ pw_msg }}</p>{% endif %}
  <form method="post" action="{{ root }}/settings/password" class="stack narrow">
    <input type="hidden" name="csrf" value="{{ sess.csrf }}">
    <input type="text" name="username" value="{{ sess.login }}" autocomplete="username" hidden>
    <label>Старый пароль
      <input name="old" type="password" autocomplete="current-password" required>
    </label>
    <label>Новый пароль, не короче 10 знаков
      <input name="new" type="password" minlength="10" autocomplete="new-password" required>
    </label>
    <label>Новый пароль ещё раз
      <input name="new2" type="password" minlength="10" autocomplete="new-password" required>
    </label>
    <button type="submit" class="primary">Сменить пароль</button>
  </form>
  <p class="muted">Остальные настройки появятся на шестом этапе.</p>
</section>
{% endblock %}
