# Новый сайт на /Claude/v2. Кладётся в /etc/nginx/snippets/webui2.conf и
# подключается строкой include внутри блока server mokeevasky.ru — до глобальных
# правил. Длинный префикс /Claude/v2/ выигрывает у /Claude/ старого сайта.

# Частота обращений к форме входа (зона login общая со старым сайтом)
location = /Claude/v2/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8002/login;
    include /etc/nginx/snippets/webui-proxy.conf;
}

location /Claude/v2/ {
    proxy_pass http://127.0.0.1:8002/;
    include /etc/nginx/snippets/webui-proxy.conf;

    # Поток ответа не копится в буфере, долгие ответы не обрываются
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

location = /Claude/v2 { return 301 /Claude/v2/; }
