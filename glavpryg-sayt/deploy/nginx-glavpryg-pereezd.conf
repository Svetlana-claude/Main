# Сайт «Главпрыг» переехал на Beget, адрес glavprig.ru. Этот файл заменяет
# /etc/nginx/snippets/glavpryg.conf; прежние правила — nginx-glavpryg.conf.
# Пока на новом адресе нет сертификата, ведём на http и временным переходом;
# с сертификатом — https и permanent.
location = /glavpryg { return 302 http://glavprig.ru/; }
location ^~ /glavpryg/ {
    rewrite ^/glavpryg/(.*)$ http://glavprig.ru/$1 redirect;
}
