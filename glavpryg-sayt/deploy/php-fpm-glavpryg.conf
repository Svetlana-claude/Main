; Пул PHP-FPM под сайт «Главпрыг».
; Место в системе: /etc/php/8.4/fpm/pool.d/glavpryg.conf
;
; Свой пул, а не общий www: у сайта отдельный сокет и отдельный журнал ошибок,
; а перезапуск и предел числа процессов не задевают ничего постороннего.

[glavpryg]

user = www-data
group = www-data

listen = /run/php/php8.4-fpm-glavpryg.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand, а не dynamic: на машине 2.9 ГБ ОЗУ, рядом живут PostgreSQL,
; MariaDB и веб-интерфейс. Простаивающий сайт не должен держать процессы —
; они поднимаются на запрос и уходят через полминуты тишины.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Ошибки — в свой журнал, иначе они теряются в общем
php_admin_value[error_log] = /var/log/php8.4-fpm-glavpryg.log
php_admin_flag[log_errors] = on

; Загрузка видео и больших фотографий из админки. То же число стоит
; в public/.user.ini самого сайта и в client_max_body_size у nginx —
; предел держат все трое, и поднимать его надо втроём.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 72M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120

; Сайт живёт только в своём каталоге и во временных папках: даже если найдётся
; дыра с чтением произвольного файла, из этого списка она не выйдет.
php_admin_value[open_basedir] = /var/www/glavpryg:/tmp:/var/lib/php/sessions
