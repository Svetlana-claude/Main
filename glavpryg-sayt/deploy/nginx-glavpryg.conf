# Сайт «Главпрыг» — https://mokeevasky.ru/glavpryg
#
# Laravel 13 + Orchid на PHP-FPM. Отдаёт его тот же server-блок, что и
# веб-интерфейс, — сайт живёт подкаталогом домена.
#
# Место в системе: /etc/nginx/snippets/glavpryg.conf
# Подключается внутрь server-блока mokeevasky.ru (sites-available/webui):
#     include /etc/nginx/snippets/glavpryg.conf;
#
# Почему отдельным сниппетом, а не строками в самом webui.conf: конфиг домена
# раскладывает webui-deploy по закрытому списку файлов, и правка живого
# экземпляра руками была бы потеряна при следующей выкладке интерфейса.

# Без завершающего слеша браузер считает страницу файлом и склеивает
# относительные ссылки от корня домена.
location = /glavpryg { return 301 /glavpryg/; }

location ^~ /glavpryg/ {
    # ⚠️ root с подставным каталогом, а не alias. Каталог /var/www/glavpryg-koren
    # пуст, в нём одна ссылка glavpryg → /var/www/glavpryg/public, поэтому адрес
    # /glavpryg/… сам собой ложится на нужный файл. Alias здесь тоже работает,
    # но вместе с try_files он даёт известную осечку nginx: $uri достраивается
    # то от alias, то от root, и часть запросов уходит мимо файла. Со ссылкой
    # этой развилки нет вовсе.
    root /var/www/glavpryg-koren;
    index index.php;

    # Загрузка видео и больших фотографий из админки. Предел держат трое:
    # здесь, в пуле PHP-FPM и в public/.user.ini самого сайта.
    client_max_body_size 72m;

    # Нет такого файла — отдаём запрос приложению. Без этой строки открывалась
    # бы только главная, а все внутренние адреса давали бы 404.
    try_files $uri $uri/ /glavpryg/index.php?$query_string;

    location ~ ^/glavpryg/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-glavpryg.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Приложение стоит за прокси и само TLS не видит: без этой строки
        # Laravel сочтёт соединение открытым и начнёт собирать ссылки с http://,
        # а браузер — ругаться на смешанное содержимое.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Точечные файлы наружу не отдаём: .env с паролем базы лежит выше корня,
    # но .git и подобное могут появиться рядом в любой момент.
    location ~ ^/glavpryg/\.(?!well-known) { deny all; }
}

# ⚠️ Плата за жизнь в подкаталоге: два пути отданы сайту от корня домена.
#
# `/images/…` — так на картинки ссылается вёрстка сайта (около двадцати мест
# в шаблонах и одно в css/home.css), не через asset(). Внутри подкаталога
# такие ссылки промахиваются мимо файла.
#
# `/vendor/orchid/…` — так админка Orchid подключает свои стили и скрипты.
# Помощник `mix()` берёт основу из `app.mix_url`, а не из `ASSET_URL`, и в
# конфиге такого ключа нет вовсе — значит, адрес выходит от корня. Без этого
# блока админка открывается голой разметкой без оформления и без скриптов.
#
# Оба блока держатся на том, что на домене эти пути свободны: занят только
# `/Claude/`. Уйдут они, когда сайт переедет на свой домен или разработчик
# переведёт ссылки на asset() (см. current_questions.md).
location ^~ /images/ {
    root /var/www/glavpryg/public;
    access_log off;
    expires 7d;
}

location ^~ /vendor/orchid/ {
    root /var/www/glavpryg/public;
    access_log off;
    expires 7d;
}
