# Сайт «Главпрыг» — https://mokeevasky.ru/glavpryg
#
# Статика, nginx отдаёт её сам из /var/www/glavpryg. Исходники живут в
# репозитории (glavpryg-sayt/public), на место их кладёт deploy/vylozhit.sh.
#
# Место в системе: /etc/nginx/snippets/glavpryg.conf
# Подключается внутрь server-блока mokeevasky.ru (sites-available/webui):
#     include /etc/nginx/snippets/glavpryg.conf;
#
# Почему отдельным сниппетом, а не строками в самом webui.conf: конфиг домена
# раскладывает webui-deploy из webui/deploy/nginx-webui.conf по закрытому списку
# файлов, и правка живого экземпляра руками была бы потеряна при следующей
# выкладке интерфейса.

# Без завершающего слеша браузер считает страницу файлом и склеивает
# относительные ссылки от корня: /styles.css вместо /glavpryg/styles.css.
location = /glavpryg { return 301 /glavpryg/; }

location /glavpryg/ {
    alias /var/www/glavpryg/;
    index index.html;
    try_files $uri $uri/ =404;

    error_page 404 /glavpryg/404.html;

    # gzip в nginx.conf включён, но по умолчанию жмёт только text/html
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ⚠️ add_header внутри location отменяет наследование add_header сервера —
    # не часть заголовков, а все сразу. Поэтому три заголовка с уровня server
    # повторены здесь дословно. Уберёшь их — у страниц сайта молча пропадут
    # nosniff, X-Frame-Options и Referrer-Policy, а интерфейс их сохранит,
    # так что по одной странице разницу не заметить.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Имена файлов без отпечатка содержимого, значит держать их в кэше нельзя:
    # правка сайта не дошла бы до посетителя, который уже заходил. «no-cache» —
    # это не «не кэшировать», а «спрашивать перед каждым показом»: ответ 304
    # стоит одного запроса без тела. Когда у сайта появится сборка с
    # отпечатками в именах, статику можно будет закэшировать надолго.
    add_header Cache-Control "no-cache" always;
}
