# Сайт «Главпрыг» на своём домене — https://главпрыг.рф
# ЗАГОТОВКА К ПЕРЕЕЗДУ: в nginx не подключена. Порядок — в
# glavpryg-sayt/zapusk/pereezd-na-domen.md.
#
# Место в системе: /etc/nginx/sites-available/glavpryg-domen,
# ссылка из sites-enabled. Домен в nginx — только punycode:
# главпрыг.рф = xn--80aebc1b0ah2g.xn--p1ai.
#
# Отличие от жизни в подкаталоге (deploy/nginx-glavpryg.conf): сайт стоит в
# корне домена, поэтому подставной каталог glavpryg-koren и отдельные блоки
# /images/ и /vendor/orchid/ не нужны — root смотрит прямо в public/.

# Старые адреса Tilda → новые страницы. Постоянный (301) переезд передаёт
# поисковику вес старой страницы; без него закладки и выдача ведут на 404.
# ⚠️ Соответствие — по названиям страниц Tilda; заказчику сверить по
# содержанию до переезда.
map $uri $glavpryg_tilda {
    default         "";
    /tandem         /services/tandem;
    /phototandem    /services/tandem;
    /photo          /services/tandem;
    /prig           /services/samostoyatelnyy;
    /education      /services/obuchenie;
    /sport          /services/sportivnye;
    /arbalet        /services/sportivnye;
    /fly            /prices;
    /sert1          /certificate;
    /sert-form      /certificate/order;
    /news           /blog;
    /contact        /contacts;
    /fitback        /about;
    /more           /about;
    /fun            /;
    /docs           /legal/privacy;
    /conf           /legal/privacy;
    /user           /legal/terms;
    ~^/page[0-9]+\.html$  /;
}

# HTTP → HTTPS; проверка Let's Encrypt идёт по HTTP
server {
    listen 80;
    listen [::]:80;
    server_name xn--80aebc1b0ah2g.xn--p1ai www.xn--80aebc1b0ah2g.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://xn--80aebc1b0ah2g.xn--p1ai$request_uri; }
}

# www → без www: одна каноническая копия сайта для поисковиков
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xn--80aebc1b0ah2g.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80aebc1b0ah2g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aebc1b0ah2g.xn--p1ai/privkey.pem;

    return 301 https://xn--80aebc1b0ah2g.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80aebc1b0ah2g.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80aebc1b0ah2g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aebc1b0ah2g.xn--p1ai/privkey.pem;

    root /var/www/glavpryg/public;
    index index.php;
    charset utf-8;

    # Те же заголовки, что у mokeevasky.ru (проверяет tests/check-glavpryg.sh)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Загрузка видео и больших фотографий из админки — как в подкаталоге
    client_max_body_size 72m;

    if ($glavpryg_tilda) { return 301 $glavpryg_tilda; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-glavpryg.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) { deny all; }

    location ^~ /images/        { access_log off; expires 7d; }
    location ^~ /vendor/orchid/ { access_log off; expires 7d; }
    location ^~ /fonts/         { access_log off; expires 30d; }

    # 3D-модели — как в подкаталоге
    location ^~ /model-3d/ {
        index index.html;
        types {
            text/html html; text/css css; application/javascript js;
            image/webp webp; model/gltf-binary glb;
        }
        gzip_static on;
        gzip_types text/css application/javascript model/gltf-binary;
        gzip_vary on;
        add_header Cache-Control "public, max-age=3600";
        # Страницу браузер перепроверяет при каждом открытии (по ETag — без
        # перекачки, если не менялась): в ней адреса модели и обложки с версией
        # (?v=…), и с часовым кешем страницы заказчик час видел прежнюю модель.
        location ~ "\.html$" {
            add_header Cache-Control "no-cache";
        }
        location ~ "-[A-Z0-9]{8}\.js$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

# ---------------------------------------------------------------------------
# После переезда: старый подкаталог уводится на новый домен 301-м.
# Этими строками заменяется содержимое /etc/nginx/snippets/glavpryg.conf
# (блоки /images/ и /vendor/orchid/ оттуда уходят вместе с ним):
