# «Здоровье семьи» на /zdorovye. Кладётся в /etc/nginx/snippets/zdorovye.conf и
# подключается строкой include внутри блока server mokeevasky.ru, рядом с webui2.

# Частота обращений к формам входа и приглашения (зона login общая с основным сайтом)
location = /zdorovye/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8003/login;
    include /etc/nginx/snippets/webui-proxy.conf;
}
location ~ ^/zdorovye/(join|setup)/ {
    limit_req zone=login burst=5 nodelay;
    rewrite ^/zdorovye/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8003;
    include /etc/nginx/snippets/webui-proxy.conf;
}

location /zdorovye/ {
    proxy_pass http://127.0.0.1:8003/;
    include /etc/nginx/snippets/webui-proxy.conf;
    client_max_body_size 30m;     # чуть больше предела бланка в приложении (25 МБ)
}

location = /zdorovye { return 301 /zdorovye/; }
